# HeyMine AI Labs — Azure Container Apps Deployment
#
# Pipeline:
#   push to main
#     → Build Docker image from backend/ context
#     → Push to GitHub Container Registry (GHCR)
#     → Login to Azure via OIDC (no password secret required)
#     → Configure GHCR pull credentials on the Container App
#     → Deploy to Azure Container Apps

name: Build and Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sadeharshavardhan/heymine_ai_labs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # Required to push to GHCR
      id-token: write    # Required for OIDC login to Azure

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Login to GHCR (uses built-in GITHUB_TOKEN — no extra secrets) ─────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Build Docker image from backend directory ──────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            ./backend
          echo "✅ Backend Docker image built: ${{ env.IMAGE }}:${{ github.sha }}"

      # ── 4. Push image to GHCR ────────────────────────────────────────────────
      - name: Push image to GHCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          echo "✅ Image pushed to GHCR"

      # ── 5. Login to Azure via OIDC (passwordless — no AZURE_CREDENTIALS) ─────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 6. Configure GHCR pull credentials on the Container App ──────────────
      - name: Update GHCR registry credentials on Container App
        run: |
          az containerapp registry set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GHCR_PAT }}
          echo "✅ GHCR registry credentials updated"

      # ── 7. Deploy to Azure Container Apps ────────────────────────────────────
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}:${{ github.sha }}
          echo "✅ Deployment triggered successfully"

      # ── 8. Print live URL ─────────────────────────────────────────────────────
      - name: Get Container App URL
        run: |
          URL=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "🌐 HeyMine API live at: https://$URL"
          echo "❤️  Health check:       https://$URL/health"
          echo "🔖 Version check:       https://$URL/version"
