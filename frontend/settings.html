<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings · HeyMine AI Labs</title>
    <meta name="description" content="Manage your HeyMine AI Labs account, API key, and preferences." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell" style="width:min(100%,520px)">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-logo">⚡</div>
        <span class="auth-brand-name">HeyMine AI Labs</span>
      </div>

      <!-- Card -->
      <section class="auth-card">

        <!-- Profile block -->
        <div class="settings-profile-block">
          <div class="settings-avatar" id="profileAvatar">U</div>
          <div>
            <div style="font-weight:700;font-size:15px;color:var(--auth-text)" id="profileUsername">Loading…</div>
            <div style="font-size:13px;color:var(--auth-muted)" id="profileEmail"></div>
          </div>
        </div>

        <!-- ── Groq API Key section ── -->
        <p class="settings-section-title">🔑 Groq API Key</p>

        <!-- Info banner -->
        <div style="
          background: rgba(108,92,231,0.07);
          border: 1px solid rgba(108,92,231,0.18);
          border-radius: 11px;
          padding: 14px 16px;
          font-size: 13px;
          color: var(--auth-muted2);
          line-height: 1.6;
          margin-bottom: 20px;
        ">
          🚀 <strong style="color:var(--auth-text)">Use your own Groq API key</strong> for unlimited AI sessions with no shared-rate-limit delays.<br/>
          Get a free key in 30 seconds at
          <a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:#a29bfe;font-weight:600;text-decoration:none">console.groq.com/keys →</a>
        </div>

        <form class="auth-form" id="settingsForm" novalidate>

          <div class="auth-field">
            <label for="groqApiKey">Paste your Groq API key</label>
            <div class="auth-password-wrap has-paste">
              <input
                id="groqApiKey"
                type="password"
                placeholder="gsk_••••••••••••••••••••••••••••••••"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" class="auth-field-paste" id="pasteApiKey" aria-label="Paste from clipboard">Paste</button>
              <button type="button" class="auth-password-toggle" id="toggleApiKey" aria-label="Show/hide key">👁</button>
            </div>
            <div style="font-size:12px;color:var(--auth-muted);margin-top:2px">
              Key status: <strong id="keyStatus" style="color:var(--auth-muted2)">Checking…</strong>
            </div>
          </div>

          <!-- Toggle: use own key -->
          <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:rgba(255,255,255,0.03);
            border:1px solid var(--auth-border);
            border-radius:11px;
            padding:14px 16px;
          ">
            <div>
              <div style="font-size:14px;font-weight:600;color:var(--auth-text)">Use my own Groq key</div>
              <div style="font-size:12px;color:var(--auth-muted);margin-top:3px">Enable to use your key instead of the shared one</div>
            </div>
            <label class="auth-toggle-switch">
              <input type="checkbox" id="useOwnKey" />
              <span class="auth-toggle-track"></span>
            </label>
          </div>

          <button class="auth-button" type="submit" id="saveKeyBtn">Save API key</button>
        </form>

        <div id="authMessage" class="auth-message" role="alert"></div>

        <!-- ── Actions ── -->
        <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px">
          <a href="/compiler" class="auth-button outline" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none">
            💻 Back to Compiler
          </a>
          <button class="auth-button danger" id="logoutBtn" type="button">Sign out</button>
        </div>

      </section>
    </main>

    <script>window._HEYMINE_API_BASE = "https://heymine-api.victoriousbeach-c448466f.centralindia.azurecontainerapps.io";</script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
