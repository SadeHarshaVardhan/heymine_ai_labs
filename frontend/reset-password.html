<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password · HeyMine AI Labs</title>
    <meta name="description" content="Choose a new password for your HeyMine AI Labs account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-logo">⚡</div>
        <span class="auth-brand-name">HeyMine AI Labs</span>
      </div>

      <!-- Card -->
      <section class="auth-card">

        <div style="font-size:36px;margin-bottom:16px;text-align:center">🔑</div>
        <h1 style="text-align:center">Set a new password</h1>
        <p class="auth-subtitle" style="text-align:center">Choose something strong — at least 6 characters.</p>

        <form class="auth-form" id="resetForm" novalidate>

          <div class="auth-field">
            <label for="password">New password</label>
            <div class="auth-password-wrap">
              <input id="password" type="password" placeholder="min. 6 characters" required autocomplete="new-password" minlength="6" />
              <button type="button" class="auth-password-toggle" id="togglePassword" aria-label="Show/hide password">👁</button>
            </div>
            <div class="auth-strength" id="strengthBar">
              <div class="auth-strength-bar" id="strengthFill"></div>
            </div>
            <span class="auth-strength-label" id="strengthLabel"></span>
          </div>

          <div class="auth-field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="auth-password-wrap">
              <input id="confirmPassword" type="password" placeholder="repeat password" required autocomplete="new-password" minlength="6" />
              <button type="button" class="auth-password-toggle" id="toggleConfirm" aria-label="Show/hide password">👁</button>
            </div>
          </div>

          <button class="auth-button" type="submit" id="resetBtn">Update password</button>
        </form>

        <div id="authMessage" class="auth-message" role="alert"></div>

        <div class="auth-links">
          <a href="/login">← Back to sign in</a>
        </div>
      </section>
    </main>

    <script>window._HEYMINE_API_BASE = "https://heymine-api.victoriousbeach-c448466f.centralindia.azurecontainerapps.io";</script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
