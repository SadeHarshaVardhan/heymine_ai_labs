<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password · HeyMine AI Labs</title>
    <meta name="description" content="Reset your HeyMine AI Labs password." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-logo">⚡</div>
        <span class="auth-brand-name">HeyMine AI Labs</span>
      </div>

      <!-- Card -->
      <section class="auth-card">

        <div style="font-size:36px;margin-bottom:16px;text-align:center">🔐</div>
        <h1 style="text-align:center">Forgot your password?</h1>
        <p class="auth-subtitle" style="text-align:center">
          No worries — enter your email and we'll send a secure reset link straight to your inbox.
        </p>

        <form class="auth-form" id="forgotForm" novalidate>

          <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
          </div>

          <button class="auth-button" type="submit" id="forgotBtn">Send reset link</button>
        </form>

        <div id="authMessage" class="auth-message" role="alert"></div>

        <div class="auth-links">
          <a href="/login">← Back to sign in</a>
        </div>
      </section>
    </main>

    <script>window._HEYMINE_API_BASE = "https://heymine-api.victoriousbeach-c448466f.centralindia.azurecontainerapps.io";</script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
