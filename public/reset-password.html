<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password · HeyMine AI Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <div class="auth-brand"><span>HeyMine AI Labs</span></div>
      <section class="auth-card">
        <h1>Choose new password</h1>
        <p>Create a new password for your HeyMine account.</p>
        <form class="auth-form" id="resetForm">
          <div class="auth-field">
            <label for="password">New password</label>
            <input id="password" type="password" required autocomplete="new-password" minlength="6" />
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" required autocomplete="new-password" minlength="6" />
          </div>
          <button class="auth-button" type="submit">Update password</button>
        </form>
        <div id="authMessage" class="auth-message"></div>
      </section>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
